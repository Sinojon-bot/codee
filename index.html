<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0f172a;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    display: grid;
    place-items: center;
}
.card {
    background: #1e293b;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    width: 90%;
    max-width: 420px;
}
h1 { font-size: 28px; }

p {
    color: #cbd5e1;
    line-height: 1.6;
}
button {
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 10px;
    padding: 16px 38px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 15px;
}
button:disabled { opacity: .5; }

#status {
    margin-top: 20px;
    overflow-wrap: anywhere;
}
</style>
</head>
<body>

<div class="card">
    <h1>Хуш омадед!</h1>

    <p>
      Ин барномаи санҷишӣ аз камераи
      ҳамин компютер акс мегирад ва
      онро ба Telegram мефиристад.
      Бо пахши тугма шумо ба ин
      амал розигӣ медиҳед.
    </p>

    <button id="btn" onclick="start()">
        Продолжить
    </button>

    <p id="status"></p>
</div>

<script>
async function start() {
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");

    btn.disabled = true;
    status.textContent = "Коркард оғоз шуд...";

    try {
        const response = await fetch("/capture", {
            method: "POST"
        });

        const result = await response.json();
        status.textContent = result.message;

    } catch (error) {
        status.textContent = "Хатои пайвастшавӣ.";
    }

    btn.disabled = false;
}
</script>

</body>
</html>
